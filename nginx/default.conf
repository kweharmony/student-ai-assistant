# ============================================================
# nginx на домашнем сервере — точка входа из WireGuard-туннеля
# Принимает трафик от VPS и маршрутизирует:
#   /           → фронтенд (статика React)
#   /api/       → бэкенд FastAPI (порт 8000)
# ============================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемых файлов (аудио до 100 МБ)
    client_max_body_size 100m;

    # Gzip-сжатие для статики и API-ответов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # API-запросы → FastAPI бэкенд
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймаут для долгих операций (транскрибация Whisper)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Всё остальное → фронтенд (React статика)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
