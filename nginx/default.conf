# ============================================================
# nginx на домашнем сервере — точка входа из WireGuard-туннеля
# Принимает трафик от VPS и маршрутизирует:
#   /           → фронтенд (статика React)
#   /api/       → бэкенд FastAPI (порт 8000)
# ============================================================

server {
    listen 80;
    server_name _;

    # Docker internal DNS — переразрешает имена контейнеров при перезапуске
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Максимальный размер загружаемых файлов (аудио до 100 МБ)
    client_max_body_size 100m;

    # Gzip-сжатие для статики и API-ответов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # API-запросы → FastAPI бэкенд
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймаут для долгих операций (транскрибация Whisper)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Всё остальное → фронтенд (React статика)
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
