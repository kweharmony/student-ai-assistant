# ============================================================
# nginx внутри контейнера frontend — SPA-конфиг
# Все маршруты React → index.html
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все несуществующие пути → index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических файлов (JS/CSS с хешами в имени)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Не кэшировать index.html (чтобы обновления подтягивались)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
