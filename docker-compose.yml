version: "3.9"

services:
  # ==================== PostgreSQL ====================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindesync_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mindesync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindesync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ==================== FastAPI Backend ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindesync}:${POSTGRES_PASSWORD:-mindesync_secret}@db:5432/${POSTGRES_DB:-mindesync}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ==================== React Frontend ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - internal

  # ==================== Nginx (точка входа) ====================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  pgdata:
  app_data:

networks:
  internal:
    driver: bridge
